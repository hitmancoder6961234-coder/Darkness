<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#08111f">
    <title>Page not found | Darkness</title>
    <!-- self-contained on purpose: a 404 can be served from any depth (/a/b/c) and on a project path (/Darkness/),
         so it uses no relative CSS, JS or image URLs -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: #eef2ff;
               font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
               background: radial-gradient(ellipse at 20% 10%, rgba(78,163,255,.25), transparent 55%), radial-gradient(ellipse at 85% 90%, rgba(139,92,246,.28), transparent 55%), linear-gradient(135deg, #070f1c, #0f2a4d); }
        .card { max-width: 460px; padding: 36px 30px; border-radius: 22px; background: rgba(14,24,44,.82); border: 1px solid rgba(255,255,255,.14);
                box-shadow: 0 30px 80px -20px rgba(0,0,0,.85), 0 0 70px -22px rgba(124,58,237,.75); }
        svg { width: 84px; height: 84px; filter: drop-shadow(0 0 18px rgba(124,58,237,.8)); animation: float 5s ease-in-out infinite; }
        @keyframes float { 50% { transform: translateY(-5px); } }
        h1 { margin: 14px 0 4px; font-size: 3.2rem; line-height: 1; letter-spacing: 6px; background: linear-gradient(90deg, #5eead4, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
        p { color: #94a3b8; margin: 10px 0 22px; line-height: 1.6; }
        a { display: inline-block; padding: 12px 26px; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 600;
            background: linear-gradient(135deg, #7c3aed, #2563eb); box-shadow: 0 8px 28px -8px rgba(124,58,237,.95); transition: transform .25s, box-shadow .25s; }
        a:hover { transform: translateY(-2px); box-shadow: 0 12px 34px -6px rgba(124,58,237,1); }
        a:focus-visible { outline: 2px solid #4ea3ff; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { svg { animation: none; } a { transition: none; } }
    </style>
</head>
<body>
    <main class="card">
        <svg viewBox="0 0 100 100" role="img" aria-label="Darkness logo">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
            <path d="M30 22h24c16 0 26 11 26 28s-10 28-26 28H30z" fill="none" stroke="url(#g)" stroke-width="9" stroke-linejoin="round"/>
            <circle cx="55" cy="50" r="5" fill="#fff"/>
        </svg>
        <h1>404</h1>
        <p>This page is lost in the dark. The link may be old, or the address may be mistyped.</p>
        <a id="home" href="/">Back to home</a>
    </main>
    <script>
        // project sites on GitHub Pages live under /Darkness/, everywhere else the site is at the root
        (function () { var h = location.hostname; document.getElementById("home").href = /github\.io$/.test(h) ? "/Darkness/" : "/"; })();
    </script>
</body>
</html>
