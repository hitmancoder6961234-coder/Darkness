<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Laptop Survey</title>

    <link rel="stylesheet"
          href="css/survey.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <div class="survey-container">

        <div class="survey-card">

            <h1>

                Laptop Market Research Survey

            </h1>

            <p>

                Please answer the following questions honestly.

            </p>

            <!-- Progress -->

            <div class="progress">

                <div class="progress-bar"
                     id="progressBar">

                </div>

            </div>

            <div id="progressText">

                Question 1 of 10

            </div>

            <!-- Question -->

            <div class="question-area">

                <h2 id="question">

                    Loading...

                </h2>

                <div id="options">

                </div>

            </div>

            <!-- Buttons -->

            <div class="buttons">

                <button id="previousBtn">

                    Previous

                </button>

                <button id="nextBtn">

                    Next

                </button>

                <button id="submitBtn">

                    Submit Survey

                </button>

            </div>

        </div>

    </div>

    <script src="js/survey.js"></script>

</body>

</html>
